apiVersion: v1
kind: Namespace
metadata:
  name: kubecon-slides
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubecon-slides
  namespace: kubecon-slides
  labels:
    app: kubecon-slides
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kubecon-slides
  template:
    metadata:
      labels:
        app: kubecon-slides
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: deck
          image: kubecon-slides:full
          # Never pull over conference Wi-Fi; uses image pre-loaded via 'kind load docker-image'
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          volumeMounts:
            - name: speaker-notes-dir
              mountPath: /usr/share/nginx/html/notes
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 1
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
      volumes:
        - name: speaker-notes-dir
          hostPath:
            path: /host-notes
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: kubecon-slides
  namespace: kubecon-slides
spec:
  type: NodePort
  selector:
    app: kubecon-slides
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080
