server {
  # Listens inside the unprivileged container namespace; host exposure is locked
  # to 127.0.0.1:8080 in kind-deploy/kind-config.yaml (never exposed on LAN/Wi-Fi).
  listen 8080;
  server_name localhost;
  charset utf-8;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/html text/plain text/markdown application/javascript text/javascript image/svg+xml text/css;
  gzip_min_length 1024;

  location = /healthz {
    limit_except GET HEAD { deny all; }
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location /notes/ {
    limit_except GET HEAD { deny all; }
    default_type text/plain;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location / {
    limit_except GET HEAD { deny all; }
    add_header Cache-Control "no-store" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Security: script-src 'self' strictly blocks inline/injected JS; style-src keeps 'unsafe-inline' for SVG CSS-variable attributes.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self';" always;
    try_files $uri $uri/ /index.html;
  }
}
