kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kubecon-deck
nodes:
  - role: control-plane
    extraMounts:
      # Mounts the repo's notes/ directory so Vim/VS Code atomic saves update live
      - hostPath: __HOST_NOTES_DIR__
        containerPath: /host-notes
        readOnly: true
    extraPortMappings:
      # Bind strictly to 127.0.0.1 so conference Wi-Fi peers cannot reach port 8080
      - containerPort: 30080
        hostPort: 8080
        listenAddress: "127.0.0.1"
        protocol: TCP
